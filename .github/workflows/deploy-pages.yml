name: Deploy site to Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Update Ports Catalog"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Ne se lance que lors d'un push direct OU si le scraper précédent s'est achevé avec succès
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Copy catalog to public folder
        run: |
          mkdir -p public
          cp catalog.json public/catalog.json

      - name: Build static showcase
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            artifact_id=$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false) | .id][0] // empty'
            ) || artifact_id=""

            if [ -n "$artifact_id" ]; then
              echo "Pages artifact ${artifact_id} is available."
              exit 0
            fi

            echo "Pages artifact is not visible yet (attempt ${attempt}/30)."
            sleep 2
          done

          echo "::error::Pages artifact did not become available within 60 seconds."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

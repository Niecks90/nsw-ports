name: Update Ports Catalog

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'update_catalog.py'
      - 'overrides.json'

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 récupère l'historique complet pour éviter les rejets de commit_refs / HTTP 500
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Catalog Scraper
        env:
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
        run: |
          python update_catalog.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(catalog): auto-update catalog.json [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected in catalog.json."
          fi

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="nswGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C3E3" />
      <stop offset="100%" stop-color="#FF4554" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00C3E3" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Joy-Con Left Rail (Cyan) -->
  <path d="M 24 20 C 14 20 6 28 6 38 L 6 82 C 6 92 14 100 24 100 L 32 100 L 32 20 Z" fill="#00C3E3" />
  <!-- Left Stick / Button hint -->
  <circle cx="19" cy="42" r="6" fill="#0f172a" />
  <circle cx="19" cy="72" r="4" fill="#0f172a" opacity="0.8" />

  <!-- Joy-Con Right Rail (Red/Pink) -->
  <path d="M 52 20 L 60 20 C 70 20 78 28 78 38 L 78 82 C 78 92 70 100 60 100 L 52 100 Z" fill="#FF4554" />
  <!-- Right Stick / Button hint -->
  <circle cx="65" cy="48" r="4" fill="#0f172a" opacity="0.8" />
  <circle cx="65" cy="78" r="6" fill="#0f172a" />

  <!-- Center Port Arrow / Chevron -->
  <path d="M 36 44 L 42 52 L 48 44" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="42" y1="36" x2="42" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <rect x="38" y="60" width="8" height="12" rx="2" fill="#ffffff" opacity="0.9" />

  <!-- Brand Typography -->
  <text x="105" y="77" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="900" font-size="52" fill="url(#nswGrad)" letter-spacing="-1">NSW</text>
  <text x="240" y="77" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="800" font-size="52" fill="#ffffff" letter-spacing="-0.5">PORTS</text>
</svg>
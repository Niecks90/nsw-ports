[package]
name = "src-tauri"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["stream", "json", "blocking"] }
tokio = { version = "1", features = ["full"] }
suppaftp = { version = "5.3" }
zip = "2.1"
walkdir = "2.5"
futures-util = "0.3"
tauri-plugin-store = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
tauri-plugin-shell = "2.6.0"

[build-dependencies]
tauri-build = "2.0.0"
